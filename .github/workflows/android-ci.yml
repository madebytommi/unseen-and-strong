name: Android validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug app
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-logs/assembleDebug.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build-logs/testDebugUnitTest.log

      - name: Compile instrumentation tests
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace --console=plain 2>&1 | tee build-logs/compileDebugAndroidTestKotlin.log

      - name: Run Android lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --console=plain 2>&1 | tee build-logs/lintDebug.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Instrumentation and Room checks
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and emulator packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-29;default;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure Android virtual device storage
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" build-logs

      - name: Create Android virtual device
        run: |
          echo no | avdmanager create avd \
            --force \
            --name ci-api-29 \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/ci-api-29.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee build-logs/avd-list.log
          grep -Fxq "ci-api-29" build-logs/avd-list.log

      - name: Start Android virtual device
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ci-api-29 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            -gpu swiftshader_indirect \
            > build-logs/emulator.log 2>&1 &
          echo $! > build-logs/emulator.pid

          timeout 90 adb wait-for-device
          timeout 360 bash -c '
            until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

      - name: Run instrumentation checks
        run: |
          set -o pipefail
          ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain 2>&1 | tee build-logs/connectedDebugAndroidTest.log

      - name: Stop Android virtual device
        if: always()
        run: |
          if adb get-state >/dev/null 2>&1; then
            adb emu kill
          fi
          if [ -f build-logs/emulator.pid ]; then
            emulator_pid="$(cat build-logs/emulator.pid)"
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill "$emulator_pid"
            fi
          fi

      - name: Upload instrumentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
